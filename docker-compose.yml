services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: school_coupon
      POSTGRES_USER: school_coupon
      POSTGRES_PASSWORD: school_coupon_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_coupon -d school_coupon"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - school-coupon-postgres:/var/lib/postgresql/data

volumes:
  school-coupon-postgres:
