services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: school_coupon_test
      POSTGRES_USER: school_coupon
      POSTGRES_PASSWORD: school_coupon_local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_coupon -d school_coupon_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-test-data:/var/lib/postgresql/data

volumes:
  postgres-test-data:
