events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  upstream nestjs_api {
    server api:3000;
  }

  upstream nextjs_admin {
    server admin:3001;
  }

  server {
    listen 80;
    server_name localhost;

    # 1. Staff Admin OIDC & Session Endpoints -> NestJS Backend
    location /admin/auth/ {
      proxy_pass http://nestjs_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Staff Admin Protected Operations -> NestJS Backend
    location ~ ^/admin/(cards|students|settlements) {
      proxy_pass http://nestjs_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Mobile Parent & Merchant APIs -> NestJS Backend
    location ~ ^/(api|parent|merchant|merchants)/ {
      proxy_pass http://nestjs_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Next.js Web Admin Application
    location /admin {
      proxy_pass http://nextjs_admin;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Next.js Static Chunks & Hot-reload Assets
    location /_next/ {
      proxy_pass http://nextjs_admin;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # 6. Default root redirects to Web Admin
    location = / {
      return 302 /admin;
    }
  }
}
